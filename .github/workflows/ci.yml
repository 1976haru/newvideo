name: V2 core CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: C012 mandatory DB and media preservation gate
        run: python -m pytest -q -k migration_and_preservation
      - name: C017 offline V1 failure regression fixtures
        run: python -m pytest -q tests/test_legacy_regression.py
      - run: python -m pytest -q

  c005-video-backup:
    name: C005 PowerShell Windows fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit, copy, checksum, conflict, and nonmutation
        shell: powershell
        run: .\tests\test_c005_video_backup.ps1

  c011-qt-windows:
    name: C011 Qt title identity smoke (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      NVS_RUN_QT_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m pytest -q tests/test_c011_version_identity.py tests/test_c011_gui.py
      - run: python -m nature_video_studio --smoke
      - name: C011 PowerShell 5.1 script parse (no installer execution)
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\\tools\\C011_Run_V2_Trial.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'C011 PowerShell parse failed' }
          Write-Host 'C011_INSTALLER_PARSE_PASS'
