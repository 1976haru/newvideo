name: V2 core CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  c005-video-backup:
    name: C005 PowerShell Windows fixtures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit, copy, checksum, conflict, and nonmutation
        shell: powershell
        run: .\tests\test_c005_video_backup.ps1
